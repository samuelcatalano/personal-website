<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <title>Samuel Catalano Social Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Source of social-preview.png (1200x630). Philosophy: docs/art/social-preview-philosophy.md */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0c0a08; color: #f4f0e9; font-family: 'Inter', sans-serif;
      background-image: radial-gradient(circle, rgba(255, 178, 30, .09) 1.2px, transparent 1.7px); background-size: 12px 12px; }
    .name { position: absolute; left: 72px; top: 60px; font: 400 40px/1 'Hammersmith One', sans-serif; letter-spacing: .01em; }
    .blind { position: absolute; left: 72px; right: 72px; top: 180px; height: 170px; display: flex; align-items: center; gap: 44px; padding: 0 56px; background: #060504; border: 1px solid #2c2620; border-radius: 20px;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, .9); filter: drop-shadow(0 0 22px rgba(255, 160, 0, .28)); }
    .led { font: 700 66px/1 'Inter', sans-serif; color: #ffb21e; text-transform: uppercase; white-space: nowrap; letter-spacing: .03em;
      -webkit-mask: radial-gradient(circle, #000 0 2.3px, transparent 2.8px) 0 0 / 6px 6px; mask: radial-gradient(circle, #000 0 2.3px, transparent 2.8px) 0 0 / 6px 6px; }
    .route { position: absolute; left: 72px; right: 72px; top: 440px; height: 90px; }
    .line { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; }
    .node { position: absolute; top: 7px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #0c0a08; border: 4px solid var(--c); }
    .node.hub { top: 2px; width: 30px; height: 30px; margin-left: -15px; border-color: #f4f0e9; background: #d4352e; }
    .yr { position: absolute; top: 46px; width: 60px; margin-left: -30px; text-align: center; font: 500 15px/1 'Inter', sans-serif; color: #9a8f80; font-variant-numeric: tabular-nums; }
    .role { position: absolute; left: 72px; bottom: 52px; font: 400 24px/1 'Inter', sans-serif; color: #b9ad9a; letter-spacing: .01em; }
  </style>
</head>
<body>
  <div class="name">Samuel Catalano</div>
  <div class="blind"><div class="led">83</div><div class="led">São Paulo → London</div></div>
  <div class="route" id="route"><div class="line"></div></div>
  <div class="role">Senior Software Engineer · Java · Backend · London</div>
  <script>
    // the same journey as the site: green line in Brazil, red in the UK, an interchange at the move (2019)
    const years = [2003, 2011, 2012, 2014, 2017, 2017, 2019, 2020, 2020, 2021, 2023, 2024], hub = 6, root = document.getElementById('route'), W = 1056;
    const x = (i) => (i / (years.length - 1)) * W, line = root.firstElementChild;
    line.style.background = `linear-gradient(90deg, #1f8a4c ${x(hub) / W * 100}%, #d4352e ${x(hub) / W * 100}%)`;
    years.forEach((y, i) => {
      const n = document.createElement('i'); n.className = 'node' + (i === hub ? ' hub' : ''); n.style.left = x(i) + 'px'; n.style.setProperty('--c', i < hub ? '#1f8a4c' : '#d4352e'); root.appendChild(n);
      const l = document.createElement('span'); l.className = 'yr'; l.style.left = x(i) + 'px'; l.textContent = y; root.appendChild(l);
    });
  </script>
</body>
</html>
